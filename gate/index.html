    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
      :root {
        color-scheme: dark;
        --gate-bg: #000;
        --gate-glow: rgba(66, 84, 255, 0.35);
        --gate-glow-2: rgba(138, 99, 255, 0.22);
        --gate-surface: #1e1f20;
        --gate-surface-border: rgba(255, 255, 255, 0.08);
        --gate-text: #e8eaed;
        --gate-muted: #9aa0a6;
        --gate-error: #f28b82;
        --gate-font: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html { background: var(--gate-bg); }
      body.gate-page {
        margin: 0;
        min-height: 100dvh;
        font-family: var(--gate-font);
        background: var(--gate-bg);
        color: var(--gate-text);
        -webkit-font-smoothing: antialiased;
      }
      .gate-scene {
        position: relative;
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow: hidden;
      }
      .gate-scene::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 70% 50% at 50% 42%, var(--gate-glow), transparent 70%),
          radial-gradient(ellipse 50% 40% at 55% 55%, var(--gate-glow-2), transparent 65%);
        pointer-events: none;
        transform-origin: 50% 42%;
        will-change: transform, opacity, filter;
      }
      .gate-panel {

        z-index: 1;
        width: min(640px, 100%);

      }

        letter-spacing: -0.02em;
        line-height: 1.2;
      }
      .gate-form { margin: 0; }

        gap: 12px;
        width: 100%;
        min-height: 56px;
        padding: 8px 8px 8px 20px;

        animation: gate-shake 0.45s ease;

      @keyframes gate-shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-6px); }
        40% { transform: translateX(6px); }
        60% { transform: translateX(-4px); }
        80% { transform: translateX(4px); }
      }
      .gate-input {
        flex: 1;
        min-width: 0;
        border: 0;
        background: transparent;
        color: var(--gate-text);
        font: inherit;
        font-size: 16px;
        outline: none;

      .gate-input::placeholder { color: var(--gate-muted); }
      .gate-submit {

        width: 44px;

      .gate-submit:hover { background: rgba(255, 255, 255, 0.16); }

      .gate-hint {

        min-height: 20px;
        font-size: 14px;
        color: var(--gate-error);
      }
      .gate-footer {
        margin-top: 48px;
        font-size: 13px;
        color: var(--gate-muted);
        letter-spacing: 0.02em;
      }

      html.is-exiting {

      body.is-exiting.gate-page {

      }

      body.is-exiting .gate-scene::before {
        animation: gate-glow-expand 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      body.is-exiting .gate-panel {
        animation: gate-panel-fade 1.5s ease forwards;

      @keyframes gate-bg-green {
        from { background: #000; }
        to { background: #071807; }
      }

      @keyframes gate-glow-expand {

        }
      }

      @keyframes gate-panel-fade {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        35% {

        }
        100% {
          opacity: 0;
          transform: scale(0.985);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html.is-exiting,
        body.is-exiting.gate-page {

        }
        body.is-exiting .gate-scene::before,

        }
        body.is-exiting .gate-panel {

        }
      }

    <script>
      (function () {
        "use strict";
        var COOKIE_KEY = "frc-gate-v1";
        var PASS_HASH = "c6c2307ac025abfed680cb646bc38ca3c3d6e02662a0f2faa143dcff22268a49";
        var DEFAULT_NEXT = "/seo/";
        var COOKIE_MAX_AGE = 31536000;

        function readCookie(name) {
          var parts = document.cookie.split(";");
          for (var i = 0; i < parts.length; i++) {
            var chunk = parts[i].trim();
            if (!chunk) continue;
            var eq = chunk.indexOf("=");
            if (eq === -1) continue;
            if (chunk.slice(0, eq) === name) {
              return decodeURIComponent(chunk.slice(eq + 1));
            }
          }
          return "";
        }

        function authed() {
          try {
            if (localStorage.getItem(COOKIE_KEY) === PASS_HASH) return true;
          } catch (e) {}
          return readCookie(COOKIE_KEY) === PASS_HASH;
        }

        function grant() {
          try {
            localStorage.setItem(COOKIE_KEY, PASS_HASH);
          } catch (e) {}
          var expires = new Date(Date.now() + COOKIE_MAX_AGE * 1000).toUTCString();
          var secure = location.protocol === "https:" ? "; Secure" : "";
          document.cookie =
            COOKIE_KEY +
            "=" +
            PASS_HASH +
            "; Path=/; Max-Age=" +
            COOKIE_MAX_AGE +
            "; Expires=" +
            expires +
            "; SameSite=Lax" +
            secure;
        }

        function safeNext(raw) {
          if (
            !raw ||
            raw === "/" ||
            raw === "/index.html" ||
            !raw.startsWith("/") ||
            raw.startsWith("//") ||
            raw.indexOf("/gate") === 0
          ) {
            return DEFAULT_NEXT;
          }
          return raw;
        }

        function redirectAfterLogin() {
          var next = safeNext(new URLSearchParams(location.search).get("next") || "");
          location.replace(next);
        }

        function prefersReducedMotion() {
          return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        }

        function playSuccessExit(callback) {
          if (prefersReducedMotion()) {
            document.documentElement.classList.add("is-exiting");
            document.body.classList.add("is-exiting");
            window.setTimeout(callback, 150);
            return;
          }
          document.documentElement.classList.add("is-exiting");
          document.body.classList.add("is-exiting");
          window.setTimeout(callback, 1500);
        }

        function syncAuthStores() {
          try {
            if (localStorage.getItem(COOKIE_KEY) === PASS_HASH) return;
          } catch (e) {}
          if (readCookie(COOKIE_KEY) === PASS_HASH) {
            try {
              localStorage.setItem(COOKIE_KEY, PASS_HASH);
            } catch (e) {}
          }
        }

        async function hashPassword(value) {
          var bytes = new TextEncoder().encode(value);
          var digest = await crypto.subtle.digest("SHA-256", bytes);
          return Array.from(new Uint8Array(digest), function (b) {
            return b.toString(16).padStart(2, "0");
          }).join("");
        }

        async function tryLogin(password) {
          var hash = await hashPassword(password);
          if (hash !== PASS_HASH) return false;
          grant();
          return true;
        }

        function initLogin() {
          syncAuthStores();

          if (authed()) {
            redirectAfterLogin();
            return;
          }

          var form = document.getElementById("gate-form");
          var input = document.getElementById("gate-password");
          var wrap = document.getElementById("gate-input-wrap");
          var hint = document.getElementById("gate-hint");
          if (!form || !input || !wrap) return;

          wrap.addEventListener("click", function (event) {
            if (event.target.closest(".gate-submit")) return;
            input.focus();
          });

          window.addEventListener("storage", function (event) {
            if (event.key === COOKIE_KEY && event.newValue === PASS_HASH) {
              playSuccessExit(redirectAfterLogin);
            }
          });

          form.addEventListener("submit", async function (event) {
            event.preventDefault();
            hint.textContent = "";
            wrap.classList.remove("is-error");

            var ok = await tryLogin(input.value);
            if (ok) {
              playSuccessExit(redirectAfterLogin);
              return;
            }

            wrap.classList.add("is-error");
            hint.textContent = "Неверный пароль";
            input.select();
          });

          input.focus();
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", initLogin);
        } else {
          initLogin();
        }
      })();
